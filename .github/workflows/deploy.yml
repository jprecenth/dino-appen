name: CI

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    frontend_ci:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm
                cache-dependency-path: frontend/package-lock.json

            - name: Install frontend dependencies
              working-directory: ./frontend
              run: npm ci

            - name: Run frontend lint
              working-directory: ./frontend
              run: npm run lint

    backend_ci:
        runs-on: ubuntu-latest

        services:
          mysql:
            image: mysql:8.4
            env: 
              MYSQL_ROOT_PASSWORD: testrootpassword123
              MYSQL_DATABASE: dinos_test
            ports:
              - 3306:3306
            options: >-
              --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestrootpassword123"
              --health-interval=5s
              --health-timeout=5s
              --health-retries=20

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm
                cache-dependency-path: backend/package-lock.json
                
            - name: Install backend dependencies
              working-directory: ./backend
              run: npm ci

            - name: Initialize test database
              run: |
                mysql -h 127.0.0.1 -P 3306 -u root -ptestrootpassword123 < database/init-test.sql
              
            - name: Run backend tests
              working-directory: ./backend
              env:
                DB_HOST: 127.0.0.1
                DB_PORT: 3306
                DB_NAME: dinos_test
                DB_USER: root
                DB_PASSWORD: testrootpassword123
                JWT_SECRET: test-secret-that-is-at-least-32-bytes-long
              run: npm test

    docker:
        runs-on: ubuntu-latest
        needs: [ frontend_ci, backend_ci ]
        if: github.event_name == 'push'
        steps:
            - name: Run Docker on EC2
              uses: appleboy/ssh-action@master
              env: 
                JWT_SECRET: ${{ secrets.JWT_SECRET }}
              with:
                host: ${{ secrets.EC2_HOST }}
                username: ${{ secrets.EC2_USERNAME }}
                key: ${{ secrets.EC2_SSH_KEY }}
                port: 22
                envs: JWT_SECRET
                script: |
                    cd /home/ubuntu/dino-appen
                    git pull
                    sudo --preserve-env=JWT_SECRET docker compose up --build -d express