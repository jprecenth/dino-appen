name: CI

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    frontend_ci:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm
                cache-dependency-path: frontend/package-lock.json

            - name: Install frontend dependencies
              working-directory: ./frontend
              run: npm ci

            - name: Run frontend lint
              working-directory: ./frontend
              run: npm run lint

            - name: Build frontend
              working-directory: ./frontend
              run: npm run build

    backend_ci:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install backend dependencies
              working-directory: ./backend
              run: npm ci
    
            - name: Run Vitest
              working-directory: ./backend
              run: npm run vitesting
    
    e2e: 
      runs-on: ubuntu-latest
      steps: 
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: npm
            cache-dependency-path: frontend/package-lock.json

        - name: Install frontend dependencies
          working-directory: ./frontend
          run: npm ci

        - name: Remove old docker environment
          run: docker compose -f docker-compose-test.yml down -v
          
        - name: Run docker-compose-test.yml
          env: 
            JWT_SECRET_TEST: ${{ secrets.JWT_SECRET_TEST }} 
          run: docker compose -f docker-compose-test.yml up -d

        - name: Debug Docker containers
          run: |
            docker compose -f docker-compose-test.yml ps
            docker compose -f docker-compose-test.yml logs --tail=50

        - name: Check (and retry to check) that backend is running
          run: |
            ready=false
            for i in {1..30}; do
              if curl -f http://localhost:3001/healthy; then
                echo "Backend is ready"
                ready=true
                break
              fi

              echo "Backend not ready yet..."
              sleep 2
            done
            
            if [ "$ready" != true ]; then
              echo "Backend failed to become ready"
              exit 1
            fi

        - name: Check (and retry to check) that frontend is running
          run: |
            ready=false
            for i in {1..30}; do
              if curl -f http://localhost:3000/; then
                echo "Frontend is ready"
                ready=true
                break
              fi

              echo "Frontend not ready yet..."
              sleep 2
            done

            if [ "$ready" != true ]; then
              echo "Frontend failed to become ready"
              exit 1
            fi
                     

    docker:
        runs-on: ubuntu-latest
        needs: [ frontend_ci, backend_ci, e2e ]
        if: github.event_name == 'push'
        steps:
            - name: Run Docker on EC2
              uses: appleboy/ssh-action@master
              env: 
                JWT_SECRET: ${{ secrets.JWT_SECRET }}
              with:
                host: ${{ secrets.EC2_HOST }}
                username: ${{ secrets.EC2_USERNAME }}
                key: ${{ secrets.EC2_SSH_KEY }}
                port: 22
                envs: JWT_SECRET
                script: |
                    cd /home/ubuntu/dino-appen
                    git pull
                    sudo --preserve-env=JWT_SECRET docker compose up -d mysql